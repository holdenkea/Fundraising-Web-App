{% extends "base.html" %} 

{% block title %}State and City Search{% endblock %}

{% block content %}
<div class="container">
    <h1 align="center" style="margin-top: 20px;">Search</h1>
    <form id="stateCityForm" action="/submit" method="POST">
        <input type="hidden" id="cityHref" name="cityHref">

        <div class="form-group" style="position: relative;">
            <label for="stateSearch">State:</label>
            <input type="text" id="stateSearch" name="state" class="form-control" placeholder="Type the state you want to search" oninput="fetchStates(); validateForm();">
            <div id="stateDropdown" class="dropdown-menu" style="display: none;"></div>
        </div>
        <div class="form-group">
            <label for="citySelect">City:</label>
            <select id="citySelect" name="city" class="form-control" onchange="validateForm();">
                <option value="">Select a state first</option>
            </select>
        </div>
        <div class="form-group">
            <label for="placeSelect">Fundraising Category:</label>
            <select id="placeSelect" name="place" class="form-control" onchange="validateForm();">
                <option value="" selected disabled>Select a fundraising category</option>
                {% for place in places %}
                    <option value="{{ place }}">{{ place }}</option>
                {% endfor %}           
             </select>
        </div>
        <div class="form-group">
            <label for="numPlacesSelect">Places to check:</label>
            <select id="numPlacesSelect" name="numPlaces" class="form-control" onchange="validateForm();">
                <option value="" selected disabled>Select how many places you want to check</option>
                {% for num in numPlaces %}
                    <option value="{{ num }}">{{ num }}</option>
                {% endfor %}           
             </select>
        </div>
        <button type="submit" id="submitButton" class="btn btn-primary" disabled>Submit</button>

        <!-- Spinner -->
        <div id="loadingSpinner" class="mt-3" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
            <span class="ml-2">Crawling Google Maps...</span>
        </div>

        <!-- success message -->
        <div id="submitSuccess" class="alert alert-success mt-3" style="display: none;">
            Done!
        </div>
    </form>
</div>

<script>
    async function fetchStates() {
        const input = document.getElementById('stateSearch').value;
        if (input.length < 2) { // Start searching after 2 characters
            document.getElementById('stateDropdown').innerHTML = '';
            document.getElementById('stateDropdown').style.display = 'none';
            return;
        }

        const response = await fetch(`/states?query=${encodeURIComponent(input)}`);
        const states = await response.json();
        const stateDropdown = document.getElementById('stateDropdown');
        stateDropdown.innerHTML = ''; // Clear existing dropdown options

        states.forEach(state => {
            const option = document.createElement('a');
            option.href = '#';
            option.classList.add('dropdown-item');
            option.textContent = state;
            option.onclick = () => selectState(state);
            stateDropdown.appendChild(option);
        });

        // Show dropdown if there are matches
        if (states.length > 0) {
            stateDropdown.style.display = 'block';
        } else {
            stateDropdown.style.display = 'none';
        }
    }

    async function selectState(state) {
        document.getElementById('stateSearch').value = state;
        document.getElementById('stateDropdown').style.display = 'none'; // Hide dropdown after selection

        const response = await fetch(`/cities/${encodeURIComponent(state)}`);
        const cities = await response.json();

        const citySelect = document.getElementById('citySelect');
        citySelect.innerHTML = '<option value="">Type or select a city</option>'; // Reset options

        cities.forEach(city => {
            const option = document.createElement('option');
            option.value = city.city;
            option.textContent = city.city;
            citySelect.appendChild(option);
        });

        citySelect.addEventListener('change', function() {
            const selectedCity = cities.find(city => city.city === this.value);
            document.getElementById('cityHref').value = selectedCity.href;  // Update hidden field with href
        });
    }

    async function validateForm() {
        const state = document.getElementById('stateSearch').value.trim();
        const city = document.getElementById('citySelect').value;
        const place = document.getElementById('placeSelect').value;
        const numPlaces = document.getElementById('numPlacesSelect').value;
        const submitButton = document.getElementById('submitButton');

        if (state !== "" && city !== "" && place != "" && numPlaces != "") {
            submitButton.disabled = false;
        } 
        else {
            submitButton.disabled = true;
        }
    }

    document.getElementById('stateCityForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const loading = document.getElementById('loadingSpinner');
        const success = document.getElementById('submitSuccess');
        document.getElementById('submitButton').disabled = true;
        loading.style.display = 'block';
        success.style.display = 'none';

        const formData = new FormData(this);

        try {
            const response = await fetch('/submit', {
                method: 'POST',
                body: formData,
            });

            if (response.ok) {
                const results = await response.json();  // Parse JSON response

                // Handle and display the results here
                displayResults(results);  // Call function to display results on the page

                success.style.display = 'block';
            } else {
                alert('Something went wrong with your submission.');
            }
        } 
        catch (err) {
            console.error(err);
            alert('Error submitting form.');
        } 
        finally {
            loading.style.display = 'none';
        }
    });

    function displayResults(results) {
    const resultContainer = document.createElement('div');
    resultContainer.classList.add('result-container');
    
    // build the HTML output
    let resultHtml = '<h3>Places with Fundraising:</h3><ul>';
    
    // format each document object
    results.forEach(place_document => {
        const types = place_document.types ? place_document.types.join(', ') : 'No types available';
        
        resultHtml += `
            <li class="result-item">
                <strong>Name:</strong> ${place_document.name}<br>
                <strong>Fundraising Keywords Found:</strong> ${types}<br>
                <strong>Website:</strong> <a href="${place_document.website}" target="_blank">${place_document.website}</a><br>
                <strong>Address:</strong> ${place_document.address}<br>
                <strong>Phone:</strong> ${place_document.phone}<br>
                <strong>Plus Code:</strong> ${place_document.plus}<br>
            </li>
        `;
    });
    
    resultHtml += '</ul>';
    
    // set the result HTML into the container and append it to the page
    resultContainer.innerHTML = resultHtml;
    document.querySelector('.container').appendChild(resultContainer);
}
</script>
{% endblock %}
